name: Bug report
description: Something in OpenManga does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md).

        Please check the existing issues first. If a generation failed because a provider rejected the prompt or ran
        out of quota, that is usually a provider matter rather than a bug; the job log will say which.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest reliable sequence. Include the project format and style preset if they matter.
      placeholder: |
        1. Create a comic project with the manhwa preset
        2. Plan chapter 1
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag you are running, or the commit SHA if you built from a branch.
      placeholder: "v0.1.0, or 5a8ba9b"
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: How are you running it
      options:
        - Docker Compose (docker compose up -d --build)
        - Docker Compose with published GHCR images
        - Development setup (bun dev, compose Postgres and Redis)
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: >-
        Which provider credential and which model the failing operation used — for example "DeepSeek /
        deepseek-v4-flash" or "OpenAI / gpt-image-2 low". Put "n/a" if no AI call was involved.
      placeholder: "OpenAI / gpt-image-2, quality low"
    validations:
      required: true

  - type: dropdown
    id: mock
    attributes:
      label: Does it reproduce with AI_MOCK_MODE=true
      description: >-
        Mock mode replaces the text and image providers with a local mock service. If the bug reproduces there it is
        in OpenManga; if it does not, it is likely provider-specific — which is still worth reporting, just useful to
        know.
      options:
        - "Yes, it reproduces in mock mode"
        - "No, it only happens against a real provider"
        - "Not applicable (no AI call involved)"
        - "Have not tried"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and errors
      description: >-
        Relevant output from `docker compose logs api worker`, the request ID from the error envelope, or the job
        error from the generation queue. Redact anything sensitive — note that logs already redact keys and tokens.
      render: text

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: >-
        Host OS and architecture, Docker version, and any non-default configuration that could be relevant
        (`TTS_ENABLED`, reverse proxy in front of nginx, external Postgres, and so on). Do not paste your `.env`.
